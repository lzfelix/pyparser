name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs when a PR receives new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the Python version pinned in .python-version
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
